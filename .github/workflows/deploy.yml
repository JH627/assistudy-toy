name: Build & Deploy to ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com

jobs:
  # ────────────────────────────────────────────────────────
  # Step 0: 변경된 서비스 감지
  # shared/build.gradle/settings.gradle/gradle wrapper가 바뀌면
  # 그걸 의존하는 서비스 전부 변경된 것으로 잡음 (apigateway/discovery는 :shared 미의존이라 제외)
  # ────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.filter.outputs.changes }}
      core: ${{ steps.compute.outputs.core }}
      any: ${{ steps.compute.outputs.any }}
      discovery_changed: ${{ steps.compute.outputs.discovery_changed }}
      gateway_changed: ${{ steps.compute.outputs.gateway_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Path filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            apigateway-service:
              - 'apigateway-service/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
            discovery-service:
              - 'discovery-service/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
            user-service:
              - 'user-service/**'
              - 'shared/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
            common-service:
              - 'common-service/**'
              - 'shared/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
            log-send-service:
              - 'log-send-service/**'
              - 'shared/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
            log-process-service:
              - 'log-process-service/**'
              - 'shared/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
            homework-service:
              - 'homework-service/**'
              - 'shared/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'
            webrtc-service:
              - 'webrtc-service/**'
              - 'shared/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle/**'
              - 'gradlew'

      # changes = 매치된 필터(서비스)명 JSON 배열. 여기서 discovery/gateway를 뺀 core 배열이랑
      # 개별 boolean도 같이 뽑아서 배포 단계에서 바로 씀
      - name: Compute derived outputs
        id: compute
        run: |
          ALL='${{ steps.filter.outputs.changes }}'
          echo "changed services: $ALL"

          CORE=$(echo "$ALL" | jq -c '[.[] | select(. != "apigateway-service" and . != "discovery-service")]')
          ANY=$(echo "$ALL" | jq -r 'length > 0')
          DISCOVERY=$(echo "$ALL" | jq -r 'any(. == "discovery-service")')
          GATEWAY=$(echo "$ALL" | jq -r 'any(. == "apigateway-service")')

          echo "core=$CORE" >> "$GITHUB_OUTPUT"
          echo "any=$ANY" >> "$GITHUB_OUTPUT"
          echo "discovery_changed=$DISCOVERY" >> "$GITHUB_OUTPUT"
          echo "gateway_changed=$GATEWAY" >> "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────
  # Step 1: 테스트 (Testcontainers는 ubuntu-latest 기본 Docker로 실행)
  # 변경 범위와 무관하게 항상 전체 실행 — 실패하면 이후 빌드/배포 전체를 막음
  # ────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  # ────────────────────────────────────────────────────────
  # Step 2: 변경된 서비스 JAR만 병렬 빌드
  # ────────────────────────────────────────────────────────
  build-jars:
    name: Build JARs
    runs-on: ubuntu-latest
    needs: [ test, detect-changes ]
    if: needs.detect-changes.outputs.any == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build changed service JARs
        run: |
          chmod +x gradlew
          TASKS=$(echo '${{ needs.detect-changes.outputs.all }}' | jq -r '.[] | ":\(.):bootJar"' | tr '\n' ' ')
          echo "gradle tasks: $TASKS"
          ./gradlew $TASKS -x test --parallel --no-daemon

      # 변경 안 된 서비스는 build/libs가 아예 없어서 glob이 안 걸림 -> if-no-files-found로 무시
      - name: Upload JARs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          if-no-files-found: ignore
          path: |
            apigateway-service/build/libs/*.jar
            user-service/build/libs/*.jar
            common-service/build/libs/*.jar
            log-send-service/build/libs/*.jar
            log-process-service/build/libs/*.jar
            discovery-service/build/libs/*.jar
            homework-service/build/libs/*.jar
            webrtc-service/build/libs/*.jar
          retention-days: 1

  # ────────────────────────────────────────────────────────
  # Step 3: ECR에 이미지 빌드 & 푸시 (변경된 서비스만, 병렬 실행)
  # ────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [ build-jars, detect-changes ]
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.all) }}

    steps:
      - uses: actions/checkout@v4

      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          JAR_FILE=$(ls ${{ matrix.service }}/build/libs/*.jar | grep -v plain)
          IMAGE_TAG=${{ github.sha }}
          IMAGE_URI=${{ env.ECR_REGISTRY }}/assistudy/${{ matrix.service }}

          docker build \
            -f ${{ matrix.service }}/Dockerfile.ci \
            --build-arg JAR_FILE=${JAR_FILE} \
            -t ${IMAGE_URI}:${IMAGE_TAG} \
            -t ${IMAGE_URI}:latest \
            .

          docker push ${IMAGE_URI}:${IMAGE_TAG}
          docker push ${IMAGE_URI}:latest

          echo "IMAGE_URI=${IMAGE_URI}:${IMAGE_TAG}" >> $GITHUB_ENV

  # ────────────────────────────────────────────────────────
  # Step 4: ECS 배포 (의존성 순서대로 순차 실행, 변경된 서비스만)
  # discovery → (변경된 core 서비스들) → apigateway
  # 앞 단계가 "변경 없어서 스킵"이어도 뒷 단계는 진행되도록
  # result가 success 또는 skipped일 때만 이어지게 조건을 검
  # ────────────────────────────────────────────────────────
  deploy-discovery:
    name: Deploy — discovery-service
    runs-on: ubuntu-latest
    needs: [ build-and-push, detect-changes ]
    if: needs.build-and-push.result == 'success' && needs.detect-changes.outputs.discovery_changed == 'true'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 매 배포마다 새 task definition revision을 등록하고 이미지를 :latest가 아니라
      # 커밋 SHA로 고정 - 롤백 시 이전 revision을 그대로 재적용하면 이전 이미지로 복구됨
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition discovery-service \
            --query taskDefinition > task-definition.json

      - name: Render new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: discovery-service
          image: ${{ env.ECR_REGISTRY }}/assistudy/discovery-service:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: discovery-service
          cluster: assistudy-prod
          wait-for-service-stability: true

  deploy-core-services:
    name: Deploy — core services
    runs-on: ubuntu-latest
    needs: [ build-and-push, deploy-discovery, detect-changes ]
    if: |
      !cancelled() &&
      needs.build-and-push.result == 'success' &&
      (needs.deploy-discovery.result == 'success' || needs.deploy-discovery.result == 'skipped') &&
      needs.detect-changes.outputs.core != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.core) }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition ${{ matrix.service }} \
            --query taskDefinition > task-definition.json

      - name: Render new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.service }}
          image: ${{ env.ECR_REGISTRY }}/assistudy/${{ matrix.service }}:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ matrix.service }}
          cluster: assistudy-prod
          wait-for-service-stability: true

  deploy-gateway:
    name: Deploy — apigateway-service
    runs-on: ubuntu-latest
    needs: [ build-and-push, deploy-core-services, detect-changes ]
    if: |
      !cancelled() &&
      needs.build-and-push.result == 'success' &&
      (needs.deploy-core-services.result == 'success' || needs.deploy-core-services.result == 'skipped') &&
      needs.detect-changes.outputs.gateway_changed == 'true'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition apigateway-service \
            --query taskDefinition > task-definition.json

      - name: Render new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: apigateway-service
          image: ${{ env.ECR_REGISTRY }}/assistudy/apigateway-service:${{ github.sha }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: apigateway-service
          cluster: assistudy-prod
          wait-for-service-stability: true
