name: Build & Deploy to ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com

jobs:
  # ────────────────────────────────────────────────────────
  # Step 0: 테스트 (Testcontainers는 ubuntu-latest 기본 Docker로 실행)
  # 실패하면 이후 빌드/배포 전체를 막음
  # ────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

  # ────────────────────────────────────────────────────────
  # Step 1: 모든 서비스 JAR을 한 번에 병렬 빌드
  # Gradle 캐시를 재사용해 의존성 다운로드 없이 빌드
  # ────────────────────────────────────────────────────────
  build-jars:
    name: Build JARs
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle 의존성 캐시 — build.gradle 변경 시에만 재다운로드
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 8개 서비스 JAR 동시 빌드 (--parallel)
      - name: Build all JARs
        run: |
          chmod +x gradlew
          ./gradlew \
            :apigateway-service:bootJar \
            :user-service:bootJar \
            :common-service:bootJar \
            :log-send-service:bootJar \
            :log-process-service:bootJar \
            :discovery-service:bootJar \
            :homework-service:bootJar \
            :webrtc-service:bootJar \
            -x test --parallel --no-daemon

      # 다음 job에서 사용할 수 있도록 JAR 업로드
      - name: Upload JARs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            apigateway-service/build/libs/*.jar
            user-service/build/libs/*.jar
            common-service/build/libs/*.jar
            log-send-service/build/libs/*.jar
            log-process-service/build/libs/*.jar
            discovery-service/build/libs/*.jar
            homework-service/build/libs/*.jar
            webrtc-service/build/libs/*.jar
          retention-days: 1

  # ────────────────────────────────────────────────────────
  # Step 2: ECR에 이미지 빌드 & 푸시 (서비스별 병렬 실행)
  # ────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-jars
    strategy:
      matrix:
        include:
          - service: apigateway-service
            jar_path: apigateway-service/build/libs
          - service: user-service
            jar_path: user-service/build/libs
          - service: common-service
            jar_path: common-service/build/libs
          - service: log-send-service
            jar_path: log-send-service/build/libs
          - service: log-process-service
            jar_path: log-process-service/build/libs
          - service: discovery-service
            jar_path: discovery-service/build/libs
          - service: homework-service
            jar_path: homework-service/build/libs
          - service: webrtc-service
            jar_path: webrtc-service/build/libs

    steps:
      - uses: actions/checkout@v4

      - name: Download JARs
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          JAR_FILE=$(ls ${{ matrix.jar_path }}/*.jar | grep -v plain)
          IMAGE_TAG=${{ github.sha }}
          IMAGE_URI=${{ env.ECR_REGISTRY }}/assistudy/${{ matrix.service }}

          docker build \
            -f ${{ matrix.service }}/Dockerfile.ci \
            --build-arg JAR_FILE=${JAR_FILE} \
            -t ${IMAGE_URI}:${IMAGE_TAG} \
            -t ${IMAGE_URI}:latest \
            .

          docker push ${IMAGE_URI}:${IMAGE_TAG}
          docker push ${IMAGE_URI}:latest

          echo "IMAGE_URI=${IMAGE_URI}:${IMAGE_TAG}" >> $GITHUB_ENV

  # ────────────────────────────────────────────────────────
  # Step 3: ECS 배포 (의존성 순서대로 순차 실행)
  # discovery → (user, common, log-send, log-process) → apigateway
  # ────────────────────────────────────────────────────────
  deploy-discovery:
    name: Deploy — discovery-service
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster assistudy-prod \
            --service discovery-service \
            --force-new-deployment

          # 안정화 대기 (다음 서비스 배포 전에 완료 확인)
          aws ecs wait services-stable \
            --cluster assistudy-prod \
            --services discovery-service

  deploy-core-services:
    name: Deploy — core services
    runs-on: ubuntu-latest
    needs: deploy-discovery
    strategy:
      matrix:
        service: [user-service, common-service, log-send-service, log-process-service, homework-service, webrtc-service]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster assistudy-prod \
            --service ${{ matrix.service }} \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster assistudy-prod \
            --services ${{ matrix.service }}

  deploy-gateway:
    name: Deploy — apigateway-service
    runs-on: ubuntu-latest
    needs: deploy-core-services
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster assistudy-prod \
            --service apigateway-service \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster assistudy-prod \
            --services apigateway-service
