plugins {
	id 'java-library'
	id 'com.google.protobuf'
}

description = 'Shared library for Assistudy microservices'

// io.grpc:*/com.google.protobuf:* 버전은 루트 build.gradle의 subprojects 블록에서
// spring-grpc-dependencies BOM으로 전역 관리 (log-send/log-process처럼 gRPC를 직접
// 안 쓰지만 shared를 통해 이 아티팩트들을 transitively 받는 서비스도 버전을 찾을 수 있어야 함)

dependencies {
	api 'org.springframework.boot:spring-boot-starter-web'

	// gRPC 코드 생성물(user_service.proto)을 공용으로 노출 - user-service(서버)/common-service(클라이언트)가 공유
	api 'io.grpc:grpc-stub'
	api 'io.grpc:grpc-protobuf'
	api 'com.google.protobuf:protobuf-java'

	compileOnly 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
}

protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:${dependencyManagement.importedProperties['protobuf-java.version']}"
	}
	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:${dependencyManagement.importedProperties['grpc.version']}"
		}
	}
	generateProtoTasks {
		all()*.plugins {
			grpc {}
		}
	}
}
