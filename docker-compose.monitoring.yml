# 실행 순서:
#   1. docker compose -f docker-compose.infra.yml up -d
#   2. docker compose -f docker-compose.services.yml up -d
#   3. docker compose -f docker-compose.monitoring.yml up -d
#
# 최초 실행 전 alertmanager 설정:
#   cp monitoring/alertmanager/alertmanager.yml.example monitoring/alertmanager/alertmanager.yml
#   # alertmanager.yml 열어서 REPLACE_WITH_... 값 채우기
#
# Prometheus는 host.docker.internal을 통해 로컬 서비스의 /actuator/prometheus를 스크랩합니다.

services:

  # ──────────────────────────────────────────
  # Zipkin (Distributed Tracing UI)
  # http://localhost:19411  (9411은 Windows Hyper-V 예약 포트)
  # ──────────────────────────────────────────
  zipkin:
    image: openzipkin/zipkin:3
    container_name: assistudy-zipkin
    ports:
      - "19411:9411"   # 9411은 Windows Hyper-V 예약(9406-9505) → 19411 사용
    networks:
      - monitoring-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Prometheus (Metrics Collector)
  # http://localhost:9090
  # ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: assistudy-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Alertmanager (Alert Routing)
  # http://localhost:9093
  # 실행 전: alertmanager.yml.example → alertmanager.yml 복사 후 값 채우기
  # ──────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: assistudy-alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - monitoring-network
    restart: on-failure
    depends_on:
      - prometheus

  # ──────────────────────────────────────────
  # Grafana 대시보드 JSON 자동 다운로드 (init 컨테이너)
  # grafana 시작 전 1회 실행 후 종료됩니다.
  # ──────────────────────────────────────────
  grafana-setup:
    image: curlimages/curl:8.8.0
    container_name: assistudy-grafana-setup
    user: root
    volumes:
      - ./monitoring/grafana/provisioning/dashboards:/dashboards
    command:
      - sh
      - -c
      - |
        echo "Grafana 대시보드 JSON 다운로드 중..."

        # Spring Boot Observability (ID: 17175) - Spring Boot 3+ / Micrometer 전용
        [ -f /dashboards/spring-boot-observability.json ] || \
          curl -sLf "https://grafana.com/api/dashboards/17175/revisions/latest/download" \
            -o /dashboards/spring-boot-observability.json \
          && echo "  [OK] spring-boot-observability.json"

        # JVM Micrometer (ID: 4701)
        [ -f /dashboards/jvm-micrometer.json ] || \
          curl -sLf "https://grafana.com/api/dashboards/4701/revisions/latest/download" \
            -o /dashboards/jvm-micrometer.json \
          && echo "  [OK] jvm-micrometer.json"

        # k6 Load Testing Dashboard (ID: 2587) - InfluxDB 데이터소스 필요
        [ -f /dashboards/k6-load-test.json ] || \
          curl -sLf "https://grafana.com/api/dashboards/2587/revisions/latest/download" \
            -o /dashboards/k6-load-test.json \
          && echo "  [OK] k6-load-test.json"

        # Kafka Exporter Overview v2.0 (ID: 11963) - singlestat 미사용, Grafana 11 호환
        [ -f /dashboards/kafka-exporter.json ] || \
          curl -sLf "https://grafana.com/api/dashboards/11963/revisions/latest/download" \
            -o /dashboards/kafka-exporter.json \
          && echo "  [OK] kafka-exporter.json"

        # $$ = Docker Compose 이스케이프, 실제 셸에는 ${VAR} 로 전달됨
        [ -f /dashboards/spring-boot-observability.json ] && \
          sed -i 's/\$${DS_PROMETHEUS}/prometheus/g' /dashboards/spring-boot-observability.json
        [ -f /dashboards/jvm-micrometer.json ] && \
          sed -i 's/\$${DS_PROMETHEUS}/prometheus/g' /dashboards/jvm-micrometer.json
        [ -f /dashboards/k6-load-test.json ] && \
          sed -i 's/\$${DS_INFLUXDB}/influxdb/g' /dashboards/k6-load-test.json
        [ -f /dashboards/kafka-exporter.json ] && \
          sed -i 's/\$${DS_PROMETHEUS}/prometheus/g' /dashboards/kafka-exporter.json

        echo "완료"
    restart: "no"

  # ──────────────────────────────────────────
  # Grafana (Dashboard & Visualization)
  # http://localhost:3000  (기본 계정: admin / admin)
  # ──────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: assistudy-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceToMetrics
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      grafana-setup:
        condition: service_completed_successfully
    networks:
      - monitoring-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # InfluxDB 1.8 (k6 결과 누적 저장)
  # k6 실행: k6 run --out influxdb=http://localhost:8086/k6 <script>
  # Grafana 대시보드: k6 Load Testing Results (ID: 2587)
  # ──────────────────────────────────────────
  influxdb:
    image: influxdb:1.8
    container_name: assistudy-influxdb
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb-data:/var/lib/influxdb
    ports:
      - "8087:8086"   # 8086은 OpenVidu ingress가 점유 → 8087 사용
    networks:
      - monitoring-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Kafka Exporter (Consumer Lag 메트릭)
  # Prometheus scrape → kafka_consumer_group_lag
  # Grafana 대시보드: Kafka Exporter Overview (ID: 7589)
  # ──────────────────────────────────────────
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: assistudy-kafka-exporter
    command:
      - "--kafka.server=kafka:29092"   # infra-network 내부 통신 (host.docker.internal은 재시작 시 IP 변경됨)
    ports:
      - "19308:9308"   # 9306-9505 Windows Hyper-V 예약 범위 → 19308 사용
    networks:
      - monitoring-network
      - infra-network   # kafka:29092 접근을 위해 infra-network 추가
    restart: on-failure

networks:
  monitoring-network:
    name: monitoring-network
    driver: bridge
  infra-network:
    name: infra-network
    external: true   # docker-compose.infra.yml에서 생성됨

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  influxdb-data:
