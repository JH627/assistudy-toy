spring:
  application:
    name: user-service
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  info:
    title: User Service API
    description: Assistudy User Service - 사용자 인증, 회원 관리
    version: 1.0.0
  swagger-ui:
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
