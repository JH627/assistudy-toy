server:
  shutdown: graceful

spring:
  application:
    name: user-service
  jpa:
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  grpc:
    server:
      port: ${GRPC_SERVER_PORT:9090}

eureka:
  instance:
    metadata-map:
      # common-service의 커스텀 NameResolver가 이 메타데이터로 gRPC 포트를 찾음
      # (Eureka의 기본 instance port는 REST 포트라 gRPC 포트는 별도로 알려줘야 함)
      grpcPort: ${GRPC_SERVER_PORT:9090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://localhost:19411}/api/v2/spans

springdoc:
  info:
    title: User Service API
    description: Assistudy User Service - 사용자 인증, 회원 관리
    version: 1.0.0
  swagger-ui:
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
