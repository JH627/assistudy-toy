spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    redis:
      password: ""
  # SecurityConfig의 oauth2Login()이 ClientRegistrationRepository 빈을 무조건 요구해서
  # 최소 1개 registration이 필요 (실제 카카오/네이버 호출은 안 함, 더미 값)
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - profile_nickname
              - account_email
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            client-name: Kakao
            client-authentication-method: client_secret_post
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

eureka:
  client:
    enabled: false

management:
  tracing:
    sampling:
      probability: 0.0

# JwtUtil이 @PostConstruct에서 RSA 키로 파싱하므로 테스트 전용 더미 키페어(운영 키 아님)
jwt:
  private-key: 
  public-key: 
  access-token:
    expiration: 1800000
  refresh-token:
    expiration: 604800000
  redirect: http://localhost:8080/login/social?code=%s&role=%s

oauth:
  failure:
    redirect-uri: http://localhost:8080/login

openapi:
  service:
    gateway-url: http://localhost:8080
