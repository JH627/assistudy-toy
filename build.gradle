plugins {
	id 'java'
	id 'org.springframework.boot' apply false
	id 'io.spring.dependency-management' apply false
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'

	group = 'com.assistudy'
	version = '0.0.1-SNAPSHOT'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
	}

	configurations {
		compileOnly {
			extendsFrom annotationProcessor
		}
	}

	repositories {
		mavenCentral()
	}

	ext {
		set('springCloudVersion', "2025.1.1")
		set('springGrpcVersion', "1.0.3")
		set('testcontainersVersion', "2.0.3")
	}

	dependencyManagement {
		imports {
			mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.2"
			mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
			// io.grpc:*/com.google.protobuf:* 버전 관리. shared가 이 아티팩트들을 api로 노출해서
			// shared에 의존하는 모든 서비스(gRPC를 직접 안 쓰는 log-send/log-process 포함)가
			// 이 BOM을 봐야 버전을 해석할 수 있음 -> 서비스별로 따로 import하지 않고 여기서 전역 관리
			mavenBom "org.springframework.grpc:spring-grpc-dependencies:${springGrpcVersion}"
			// spring-boot-dependencies가 testcontainers-bom을 임포트하긴 하지만 중첩 임포트라
			// dependency-management 플러그인이 버전을 못 찾는 경우가 있어 명시적으로 다시 임포트
			mavenBom "org.testcontainers:testcontainers-bom:${testcontainersVersion}"
		}
	}

	tasks.named('test') {
		useJUnitPlatform()
		testLogging {
			exceptionFormat = 'full'
			showStackTraces = true
			events 'failed'
		}
	}
}
