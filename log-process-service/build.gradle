plugins {
    id 'java'
    id 'scala'
    id 'org.springframework.boot' version '2.7.18'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'com.assistudy'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
        exclude group: 'ch.qos.logback', module: 'logback-classic'
        exclude group: 'ch.qos.logback', module: 'logback-core'
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2021.0.8")
    set('sparkVersion', "3.4.1")
    set('scalaCompatVersion', "2.12")
}

dependencies {
    // Spring Boot Core
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Log4j2
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    implementation 'com.lmax:disruptor:3.4.4'

    // Spring Cloud MSA
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // Spark
    implementation("org.apache.spark:spark-core_${scalaCompatVersion}:${sparkVersion}") {
        exclude group: 'org.slf4j'
        exclude group: 'log4j'
        exclude group: 'org.apache.logging.log4j'
        exclude group: 'com.google.guava'
        exclude group: 'org.glassfish.jersey'
    }
    implementation("org.apache.spark:spark-sql_${scalaCompatVersion}:${sparkVersion}") {
        exclude group: 'org.slf4j'
        exclude group: 'log4j'
        exclude group: 'org.apache.logging.log4j'
        exclude group: 'com.google.guava'
        exclude group: 'org.glassfish.jersey'
    }

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Development
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation("org.springframework.kafka:spring-kafka-test") {
        exclude group: 'org.apache.kafka', module: "kafka_${scalaCompatVersion}"
        exclude group: 'org.apache.kafka', module: "kafka_2.13"
    }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.springframework.cloud:spring-cloud-starter-config'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.assistudy.logprocessservice.LogProcessServiceApplication'
        )
    }
}