spring:
  application:
    name: log-process-service
  jackson:
    time-zone: Asia/Seoul

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    operations-sorter: method
    display-request-duration: true
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
