spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
  cloud:
    inetutils:
      preferred-networks:
        - 10.20
    loadbalancer:
      cache:
        # 기본 TTL 35초 - Eureka 레지스트리 자체는 갱신돼도 LoadBalancer가 별도로
        # 들고 있는 인스턴스 목록 캐시가 이만큼 안 따라가면 소용없어서 같이 단축.
        # 실측 결과 이것만으로 다운타임이 사라지진 않았음(#39 트러블슈팅 기록 참고) -
        # 죽은 인스턴스가 잠깐 선택되는 근본 원인은 아직 미확정, 필요성 재검토 대상
        ttl: 5s

jwt:
  public-key: ${JWT_PUBLIC_KEY}
  access-token:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token:
    expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
    fetch-registry: true
    register-with-eureka: true
    # 기본값 30초 - 배포 중 옛 인스턴스 종료 후에도 최대 30초간 게이트웨이가 죽은
    # 인스턴스로 계속 라우팅할 수 있어서 5초로 단축 (효과는 위 loadbalancer.cache.ttl과 동일)
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    root: INFO
    com.assistudy: INFO
    org.springframework.cloud.gateway: WARN
    org.springframework.security: WARN
