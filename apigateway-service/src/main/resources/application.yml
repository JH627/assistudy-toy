spring:
  application:
    name: apigateway-service

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: "User Service"
        url: "/user-service/v3/api-docs"
      - name: "Common Service"
        url: "/common-service/v3/api-docs"
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
