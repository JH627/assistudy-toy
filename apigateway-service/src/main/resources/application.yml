spring:
  application:
    name: apigateway-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    gateway:
      # 배포 중 옛 태스크가 종료되는 시점 근처에는 그 인스턴스로의 연결 시도가
      # 즉시 거부되지 않고 몇 초씩 행(hang)될 수 있음(ENI/네트워크 정리 중 SYN이
      # 조용히 드롭되는 구간 - 실측: connection-refused 500과 별개로 3초 타임아웃되는
      # 요청이 관찰됨). 기본 connect-timeout이 너무 길면 그 사이 재시도 필터가 있어도
      # 시간 안에 살아있는 인스턴스로 못 넘어가서 짧게 잘라줌
      httpclient:
        connect-timeout: 1000
      # 위와 같은 이유로 죽은 인스턴스로의 연결/5xx 시 다른(살아있는) 인스턴스로
      # 재시도해서 그 틈을 메움. 쓰기 메서드는 재처리 안전성 확인 전까지 GET만 대상으로 함
      default-filters:
        - name: Retry
          args:
            retries: 2
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
            methods: GET
            backoff:
              firstBackoff: 20ms
              maxBackoff: 200ms
              factor: 2
              basedOnPreviousValue: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://localhost:19411}/api/v2/spans

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: "User Service"
        url: "/user-service/v3/api-docs"
      - name: "Common Service"
        url: "/common-service/v3/api-docs"
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
