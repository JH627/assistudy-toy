spring:
  application:
    name: apigateway-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  cloud:
    gateway:
      # 배포 중 옛 인스턴스가 종료된 직후에도 게이트웨이/로드밸런서의 로컬 Eureka
      # 캐시가 잠깐 죽은 인스턴스를 들고 있을 수 있음(레지스트리 갱신 주기 지연) -
      # connection-refused/5xx 시 다른(살아있는) 인스턴스로 재시도해서 그 틈을 메움.
      # 쓰기 메서드는 재처리 안전성 확인 전까지 GET만 대상으로 함
      default-filters:
        - name: Retry
          args:
            retries: 2
            statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
            methods: GET
            backoff:
              firstBackoff: 20ms
              maxBackoff: 200ms
              factor: 2
              basedOnPreviousValue: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://localhost:19411}/api/v2/spans

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: "User Service"
        url: "/user-service/v3/api-docs"
      - name: "Common Service"
        url: "/common-service/v3/api-docs"
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
