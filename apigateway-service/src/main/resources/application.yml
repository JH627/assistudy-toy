spring:
  application:
    name: apigateway-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_URL:http://localhost:19411}/api/v2/spans

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: "User Service"
        url: "/user-service/v3/api-docs"
      - name: "Common Service"
        url: "/common-service/v3/api-docs"
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
