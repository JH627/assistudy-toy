# AWS EC2 모니터링 스택
#
# 사전 준비:
#   cp monitoring/alertmanager/alertmanager.yml.example monitoring/alertmanager/alertmanager.yml
#   # alertmanager.yml의 REPLACE_WITH_... 값 채우기
#
# 실행:
#   docker compose -f docker-compose.monitoring-prod.yml up -d
#
# 환경변수 (EC2의 .env 파일 또는 export로 설정):
#   EUREKA_USERNAME, EUREKA_PASSWORD
#   KAFKA_BOOTSTRAP_SERVERS  (MSK 브로커 엔드포인트)
#   GRAFANA_USER, GRAFANA_PASSWORD

services:

  # ──────────────────────────────────────────
  # Zipkin (Distributed Tracing UI)
  # http://{EC2_IP}:9411
  # ──────────────────────────────────────────
  zipkin:
    image: openzipkin/zipkin:3
    container_name: assistudy-zipkin
    ports:
      - "9411:9411"
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9411/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Prometheus (Metrics Collector)
  # http://{EC2_IP}:9090
  # ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: assistudy-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    environment:
      - EUREKA_USERNAME=${EUREKA_USERNAME:-eureka}
      - EUREKA_PASSWORD=${EUREKA_PASSWORD:-eureka}
    ports:
      - "9090:9090"
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Alertmanager (Alert Routing)
  # http://{EC2_IP}:9093
  # ──────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: assistudy-alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    ports:
      - "9093:9093"
    networks:
      - monitoring-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # ──────────────────────────────────────────
  # Grafana (Dashboard & Visualization)
  # http://{EC2_IP}:3000
  # ──────────────────────────────────────────
  grafana-setup:
    image: curlimages/curl:8.8.0
    container_name: assistudy-grafana-setup
    user: root
    volumes:
      - ./monitoring/grafana/provisioning-prod/dashboards:/dashboards
    command:
      - sh
      - -c
      - |
        echo "Grafana 대시보드 JSON 다운로드 중..."

        [ -f /dashboards/spring-boot-observability.json ] || \
          curl -sLf "https://grafana.com/api/dashboards/17175/revisions/latest/download" \
            -o /dashboards/spring-boot-observability.json \
          && echo "  [OK] spring-boot-observability.json"

        [ -f /dashboards/jvm-micrometer.json ] || \
          curl -sLf "https://grafana.com/api/dashboards/4701/revisions/latest/download" \
            -o /dashboards/jvm-micrometer.json \
          && echo "  [OK] jvm-micrometer.json"

        [ -f /dashboards/kafka-exporter.json ] || \
          curl -sLf "https://grafana.com/api/dashboards/11963/revisions/latest/download" \
            -o /dashboards/kafka-exporter.json \
          && echo "  [OK] kafka-exporter.json"

        [ -f /dashboards/k6-load-test.json ] || \
          curl -sLf "https://grafana.com/api/dashboards/2587/revisions/latest/download" \
            -o /dashboards/k6-load-test.json \
          && echo "  [OK] k6-load-test.json"

        [ -f /dashboards/spring-boot-observability.json ] && \
          sed -i 's/\$${DS_PROMETHEUS}/prometheus/g' /dashboards/spring-boot-observability.json
        [ -f /dashboards/jvm-micrometer.json ] && \
          sed -i 's/\$${DS_PROMETHEUS}/prometheus/g' /dashboards/jvm-micrometer.json
        [ -f /dashboards/kafka-exporter.json ] && \
          sed -i 's/\$${DS_PROMETHEUS}/prometheus/g' /dashboards/kafka-exporter.json
        [ -f /dashboards/k6-load-test.json ] && \
          sed -i 's/\$${DS_INFLUXDB}/influxdb/g' /dashboards/k6-load-test.json

        echo "완료"
    restart: "no"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: assistudy-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceToMetrics
      - GF_SERVER_ROOT_URL=http://{EC2_IP}:3000  # EC2 IP로 교체 필요
    volumes:
      - ./monitoring/grafana/provisioning-prod:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      grafana-setup:
        condition: service_completed_successfully
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Kafka Exporter (Consumer Lag 메트릭)
  # Kafka EC2의 private IP를 KAFKA_BOOTSTRAP_SERVERS로 주입
  # ──────────────────────────────────────────
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: assistudy-kafka-exporter
    command:
      - "--kafka.server=${KAFKA_BOOTSTRAP_SERVERS}"
    ports:
      - "9308:9308"
    networks:
      - monitoring-network
    restart: unless-stopped

  # ──────────────────────────────────────────
  # InfluxDB 1.8 (k6 부하 테스트 결과 저장)
  # k6 실행: k6 run --out influxdb=http://{EC2_IP}:8086/k6 <script>
  # ──────────────────────────────────────────
  influxdb:
    image: influxdb:1.8
    container_name: assistudy-influxdb
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - influxdb-data:/var/lib/influxdb
    ports:
      - "8086:8086"
    networks:
      - monitoring-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  monitoring-network:
    name: monitoring-network
    driver: bridge

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  influxdb-data:
