spring:
  application:
    name: discovery-service

server:
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

eureka:
  server:
    username: ${EUREKA_USERNAME:eureka}
    password: ${EUREKA_PASSWORD:eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
