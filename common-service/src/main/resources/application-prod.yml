server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_COMMON_HOST}:${MYSQL_COMMON_PORT}/${MYSQL_COMMON_DB}?useSSL=true&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${MYSQL_DB_USER}
    password: ${MYSQL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

user-service:
  url: ${USER_SERVICE_URL}

livekit:
  url: ${LIVEKIT_URL}
  api:
    key: ${LIVEKIT_API_KEY}
    secret: ${LIVEKIT_SECRET}

gms:
  api:
    base-url: ${GMS_API_BASE_URL}
    key: ${GMS_API_KEY}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: false
    hostname: common-service
    instance-id: common-service:8081
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

logging:
  level:
    root: INFO
    com.assistudy: INFO
    org.springframework.security: WARN
