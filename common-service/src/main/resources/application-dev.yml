server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_COMMON_HOST:localhost}:${MYSQL_COMMON_PORT:3306}/${MYSQL_COMMON_DB:assistudy_common}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${MYSQL_DB_USER:assistudy}
    password: ${MYSQL_DB_PASSWORD:assistudy}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8082}

livekit:
  url: ${LIVEKIT_URL:http://localhost:7880}
  api:
    key: ${LIVEKIT_API_KEY:devkey}
    secret: ${LIVEKIT_SECRET:secret}

gms:
  api:
    base-url: ${GMS_API_BASE_URL:http://localhost:9090}
    key: ${GMS_API_KEY:local-key}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka:eureka@localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

openapi:
  service:
    gateway-url: http://localhost:8080

logging:
  level:
    com.assistudy: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG
