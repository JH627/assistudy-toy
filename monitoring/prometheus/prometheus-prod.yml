global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus 자기 자신
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # API Gateway (8080) - ECS Service Connect DNS
  - job_name: apigateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['apigateway-service:8080']

  # User Service (8082)
  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['user-service:8082']

  # Common Service (8081)
  - job_name: common-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['common-service:8081']

  # Log Send Service (8085)
  - job_name: log-send-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['log-send-service:8085']

  # Log Process Service (8084)
  - job_name: log-process-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['log-process-service:8084']

  # Discovery Service (8761) - Eureka Basic Auth 필요
  - job_name: discovery-service
    metrics_path: /actuator/prometheus
    basic_auth:
      username: ${EUREKA_USERNAME}
      password: ${EUREKA_PASSWORD}
    static_configs:
      - targets: ['discovery-service:8761']

  # Kafka Exporter (Consumer Lag) - 같은 EC2 내 컨테이너
  - job_name: kafka-exporter
    static_configs:
      - targets: ['kafka-exporter:9308']
