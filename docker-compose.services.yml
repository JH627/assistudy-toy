# 실행 순서:
#   1. docker compose -f docker-compose.infra.yml up -d
#   2. docker compose -f docker-compose.services.yml up -d
#
# 멀티모듈 구조로 build context는 루트(.)를 사용합니다.
# 서비스 간 통신은 service-network를 통해 컨테이너명으로 접근합니다.

services:

  # ──────────────────────────────────────────
  # Discovery Service (Eureka Server)
  # ──────────────────────────────────────────
  discovery-service:
    build:
      context: .
      dockerfile: discovery-service/Dockerfile
    container_name: assistudy-discovery
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    ports:
      - "8761:8761"
    networks:
      - service-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────
  # API Gateway Service
  # ──────────────────────────────────────────
  apigateway-service:
    build:
      context: .
      dockerfile: apigateway-service/Dockerfile
    container_name: assistudy-apigateway
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_SERVER_URL=http://eureka:eureka@discovery-service:8761/eureka
      - REDIS_HOST=host.docker.internal
      - ZIPKIN_URL=http://host.docker.internal:19411
    ports:
      - "8080:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - service-network
    restart: on-failure

  # ──────────────────────────────────────────
  # User Service
  # ──────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: assistudy-user
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_SERVER_URL=http://eureka:eureka@discovery-service:8761/eureka
      - MYSQL_USER_HOST=host.docker.internal
      - MYSQL_USER_PORT=3307
      - REDIS_HOST=host.docker.internal
      - ZIPKIN_URL=http://host.docker.internal:19411
    ports:
      - "8082:8082"
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - service-network
    restart: on-failure

  # ──────────────────────────────────────────
  # Common Service
  # ──────────────────────────────────────────
  common-service:
    build:
      context: .
      dockerfile: common-service/Dockerfile
    container_name: assistudy-common
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_SERVER_URL=http://eureka:eureka@discovery-service:8761/eureka
      - MYSQL_COMMON_HOST=host.docker.internal
      - MYSQL_COMMON_PORT=3306
      - USER_SERVICE_URL=http://user-service:8082
      - ZIPKIN_URL=http://host.docker.internal:19411
    ports:
      - "8081:8081"
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - service-network
    restart: on-failure

  # ──────────────────────────────────────────
  # Log Send Service
  # ──────────────────────────────────────────
  log-send-service:
    build:
      context: .
      dockerfile: log-send-service/Dockerfile
    container_name: assistudy-log-send
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_SERVER_URL=http://eureka:eureka@discovery-service:8761/eureka
      - KAFKA_BOOTSTRAP_SERVERS=host.docker.internal:9103
      - ZIPKIN_URL=http://host.docker.internal:19411
    ports:
      - "8085:8085"
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - service-network
    restart: on-failure

  # ──────────────────────────────────────────
  # Log Process Service
  # ──────────────────────────────────────────
  log-process-service:
    build:
      context: .
      dockerfile: log-process-service/Dockerfile
    container_name: assistudy-log-process
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_SERVER_URL=http://eureka:eureka@discovery-service:8761/eureka
      - KAFKA_BOOTSTRAP_SERVERS=host.docker.internal:9103
      - MYSQL_LOG_HOST=host.docker.internal
      - MYSQL_LOG_PORT=3308
      - ZIPKIN_URL=http://host.docker.internal:19411
    ports:
      - "8084:8084"
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - service-network
    restart: on-failure

networks:
  service-network:
    driver: bridge
