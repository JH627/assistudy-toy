spring:
  application:
    name: log-send-service

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    operations-sorter: method
    display-request-duration: true
  api-docs:
    path: /v3/api-docs
