server:
  port: 8888

spring:
  application:
    name: config-service
  profiles:
    active: ${ACTIVE_PROFILE}
  cloud:
    config:
      server:
        native:
          search-locations: file:./native-config-repo
        default-label: main
  security:
    user:
      name: ${SECURITY_USER_NAME}
      password: ${SECURITY_USER_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
